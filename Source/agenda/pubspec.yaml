name: agenda
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.2
  csv: ^8.0.0
  excel: ^4.0.6
  file_picker: ^13.3.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_contacts: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: "lib/assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/logo.png"
